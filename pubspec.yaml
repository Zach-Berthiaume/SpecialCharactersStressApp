name: special_characters
description: "CS 3541 Semester Project Spring 2025"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.4.2
  firebase_core_platform_interface: ^5.4.0
  audioplayers: ^6.1.0
  flutter_spinkit: ^5.2.0
  provider: ^6.1.4
  alarm: ^5.1.0
  intl: ^0.20.2
  float_column: ^4.0.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.3.6

flutter:

  uses-material-design: true

  assets:
    - assets/images/island.png
    - assets/images/sun.png
    - assets/images/moon.png
    - assets/images/stars.png
    - assets/images/crab.jpg
    - assets/images/coconut.png
    - assets/images/starfish.png
    - assets/images/dolphin.png
    - assets/images/pink_flower.png
    - assets/images/purple_flower.png
    - assets/images/clouds.png
    - assets/images/loading.png
    - assets/images/albumCover.png

    - assets/audio/alarmTone.wav
    - assets/audio/anxietyRelief.mp3
    - assets/audio/innerCalm.mp3
    - assets/audio/musicForStress.mp3
    - assets/audio/studyTime.mp3
    - assets/audio/Triumph_Fanfare.mp3

flutter_native_splash:
  color: "#87CEEB"
  image: assets/images/loading.png
  android: true
  ios: true
  android_12:
    image: assets/images/loading.png
    icon_background_color: "#87CEEB"