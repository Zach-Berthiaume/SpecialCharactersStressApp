buildscript {
    ext.kotlin_version = '2.0.21' // Match this version everywhere
    repositories {
        google()
        mavenCentral() // Ensure Maven Central is included
    }
    dependencies {
        // Ensure this line is included
        classpath 'com.google.gms:google-services:4.4.2'  // Or the latest version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version" // Add this line
    }
}

plugins {
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}